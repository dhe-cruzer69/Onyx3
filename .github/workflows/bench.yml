name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: latency gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install ruff pytest

      - name: Run benchmark twice (variance check)
        run: |
          set -euo pipefail
          python bench/bench_policy.py --json > bench-run-1.json
          python bench/bench_policy.py --json > bench-run-2.json

      - name: Verify gate result
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          first = json.load(open("bench-run-1.json"))
          second = json.load(open("bench-run-2.json"))
          for report in (first, second):
              if not report.get("passed"):
                  print("FAILED:", report.get("failures"))
                  sys.exit(1)
          print("Both runs passed every latency gate.")
          print(json.dumps([r["measured_speedup_vs_naive"] for r in first["results"]]))
          PY

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-evidence
          path: |
            bench-run-1.json
            bench-run-2.json
          retention-days: 30
