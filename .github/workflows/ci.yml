name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install ruff pytest
          pip install -e .
      - run: ruff check .
      - run: pytest -q
